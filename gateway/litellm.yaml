# LiteLLM gateway config for mcp-bouncer.
# Baked into the thin gateway image (gateway/Dockerfile). It holds NO
# environment-specific values; the master key and region arrive at runtime.

model_list:
  # Exactly one model. It names ONLY the EU inference profile, which is layer 1
  # of the three EU-only layers: a request for any other model name is refused
  # by LiteLLM before it reaches Bedrock. IAM and the VPC endpoint are the rest.
  - model_name: claude-sonnet-5-eu
    litellm_params:
      # bedrock/<inference-profile-id>. The `eu.` prefix is the EU-only profile;
      # this id is also asserted by tests/test_gateway_config.py to equal the
      # terraform/app default, so the model and the authorised ARNs cannot drift.
      model: bedrock/eu.anthropic.claude-sonnet-5
      # The region is supplied at runtime, never hardcoded. LiteLLM resolves an
      # `os.environ/<VAR>` reference inside litellm_params via get_secret(),
      # which strips the prefix and reads the environment variable.
      aws_region_name: os.environ/AWS_REGION

litellm_settings:
  # Sonnet 5 REJECTS `temperature` ("deprecated for this model"). drop_params
  # makes LiteLLM silently drop unsupported params rather than passing them
  # through to a ValidationException. Handled explicitly by the config loader.
  drop_params: true

  # Do NOT log prompts or responses. turn_off_message_logging redacts the
  # messages, prompt, input and response from every logging callback and from
  # the in-memory logging path, so no prompt or completion content is logged.
  turn_off_message_logging: true

  # JSON logs to stdout so CloudWatch (awslogs) ingests one JSON object per line,
  # the same pipeline as the gate. Handled explicitly by the loader, which calls
  # litellm._turn_on_json().
  json_logs: true

  # Disable LiteLLM's phone-home telemetry (no unexpected egress). It defaults to
  # True; setting it false here flips it. In the no-internet VPC any telemetry
  # call would fail anyway, so turning it off means the gateway does not try.
  telemetry: false

mcp_servers:
  # The tool gate, reachable ONLY by its Service Connect name inside the VPC. No
  # trailing slash: `/mcp/` 307-redirects to plain http:// and would strip the
  # scheme, so the endpoint is exactly `/mcp`.
  bouncer:
    url: "http://gate:8000/mcp"
    transport: "http"
    description: "mcp-bouncer governance gate"
    # Deliberately invalid static credential. Each agent forwards its OWN gate
    # token per request; this auth_value is only the fallback for an agent that
    # forgot its header, so a token-less request is refused, not defaulted.
    auth_type: "bearer_token"
    auth_value: "no-default-token"

general_settings:
  # LiteLLM's master key and, without a database, its only key and its admin key.
  # Generated at provision time, stored in Secrets Manager, and injected as
  # LITELLM_MASTER_KEY; it never appears here, in the image, or in the repository.
  master_key: os.environ/LITELLM_MASTER_KEY
