# mcp-bouncer policy. This file is the only place rules live. If anything below is
# invalid, the gate refuses to start rather than running on a policy it had to
# guess at.

defaults:
  # A tool matching nothing under `tools:` is classified `unknown`. `block` is
  # the only accepted value: a gate that allows what it cannot classify is not a
  # gate.
  unclassified: block
  # MCP tool annotations are untrusted hints from the upstream server. They may
  # raise a classification and never lower it. `escalate-only` is the only
  # accepted value.
  annotations: escalate-only

limits:
  # Approved destructive actions allowed per caller per rolling hour. Beyond
  # this, destructive calls are blocked until a human runs
  # `bouncer reset <caller>`. Best-effort under concurrency; see DESIGN.md.
  destructive_per_hour: 3
  # How long an approval stays usable. It is still one-shot within that window.
  approval_ttl_minutes: 10

tools:
  # Tool names or fnmatch globs. An exact name wins, then the first matching glob.
  # write_page is `write` because the wiki is assumed to keep history, so an
  # overwrite can be reverted. Without history it belongs in `destructive`.
  "wiki.read_page": read
  "wiki.write_page": write
  "wiki.delete_page": destructive
  # wiki.rename_page is intentionally NOT listed: the demo upstream serves it as
  # a real tool so the gate classifies it `unknown` and denies it, the realistic
  # case of an upstream growing a tool the policy has not classified yet.

actions:
  # What to do with each classification. `approve` means park the call and wait
  # for a human.
  read: pass
  write: pass
  destructive: approve

teams:
  # A team may override tool classifications, actions and limits, but ONLY to
  # tighten. Any loosening makes the gate refuse to boot. Adding a team is this
  # one block plus one token; no code changes.
  CustomerChat:
    # Customer facing, so the tightest posture. A wiki edit is visible to a
    # customer the moment it lands, so even a revertable overwrite is promoted to
    # destructive, the destructive cap drops to one per hour, and approvals halve.
    tools:
      "wiki.write_page": destructive
    limits:
      destructive_per_hour: 1
      approval_ttl_minutes: 5

  DevChat:
    # Internal tooling, so more latitude: writes still pass straight through, as
    # at baseline. The one tightening is a lower destructive cap, bounding a
    # runaway agent while leaving headroom for routine cleanup.
    limits:
      destructive_per_hour: 2
