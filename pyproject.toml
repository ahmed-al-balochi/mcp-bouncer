[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-bouncer"
version = "0.1.0"
description = "A governance proxy for MCP tool calls: classify, pass, block, or park for human approval."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Pinned: the proxy and middleware APIs the gate uses were verified against
    # exactly this version.
    "fastmcp==4.0.1",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
# boto3, for the DynamoDB stores and the Secrets Manager token source. Optional
# and imported lazily, so the default SQLite and local-token path never needs it.
aws = ["boto3>=1.34,<2"]
# The openai SDK, for demo/llm_agent.py only, so the gate image never installs it.
# Pinned to 3.19.2: the newest release that sits alongside fastmcp 4.0.1
# without changing any installed package.
llm-demo = ["openai==3.19.2"]
# moto fakes DynamoDB and Secrets Manager in-process, so the AWS-backed paths are
# proven against the same contracts as the local ones with no AWS credentials and
# no network. `openai` is here for the offline demo-agent tests against a fake.
test = [
    "pytest>=8,<10",
    "boto3>=1.34,<2",
    "moto[dynamodb,secretsmanager]>=5,<6",
    "openai==3.19.2",
]

[project.scripts]
bouncer = "gate.cli:main"
bouncer-server = "gate.server:main"

[tool.setuptools.packages.find]
include = ["gate*", "demo*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
