[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-bouncer"
version = "0.1.0"
description = "A governance proxy for MCP tool calls: classify, pass, block, or park for human approval."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Pinned: the proxy and middleware APIs the gate uses were verified against
    # exactly this version.
    "fastmcp==4.0.1",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
# boto3 is the only AWS client the gate uses, and two separate parts of it need
# one: the DynamoDB approval store and audit log, which back the gate when it is
# scaled across hosts and there is no shared SQLite file to hold the one-shot
# guarantee (R27) or the append-only trail (R29), and the Secrets Manager token
# source, which resolves bearer tokens at boot so no credential is ever baked
# into the image (R19). The extra is named for the dependency's scope rather than
# for one of its two consumers.
#
# It is OPTIONAL, not a hard dependency, so the default SQLite path and the local
# token source -- and `import gate.approvals` -- never require it (R44). Both
# consumers import boto3 lazily, so installing this is only necessary to select
# an AWS-backed store or token source.
aws = ["boto3>=1.34,<2"]
# moto fakes DynamoDB and Secrets Manager in-process, so the AWS-backed paths are
# proven against the same contracts as the local ones (A8) with no AWS
# credentials and no network (R45).
test = [
    "pytest>=8,<10",
    "boto3>=1.34,<2",
    "moto[dynamodb,secretsmanager]>=5,<6",
]

[project.scripts]
bouncer = "gate.cli:main"
bouncer-server = "gate.server:main"

[tool.setuptools.packages.find]
include = ["gate*", "demo*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
